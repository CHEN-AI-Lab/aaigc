<!DOCTYPE html>
<html>
<head><title>按钮圆角对比</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #faf9f7; padding: 40px; }
  .container { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 50px; }
  .group { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 13px; font-weight: 600; color: #999; margin-bottom: 12px; }
  .row-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #eee; }

  .btn { font-size: 14px; font-weight: 500; padding: 10px 28px; border: none; background: #c89b3c; color: white; cursor: pointer; }
  .btn-outline { background: transparent; color: #666; border: 1px solid rgba(200,155,60,0.3); }
  .btn-sm { font-size: 12px; padding: 6px 16px; }
  .btn-toggle { font-size: 13px; padding: 6px 16px; border: none; cursor: pointer; background: #f0ede8; color: #666; }
  .btn-toggle-active { background: #c89b3c; color: white; }

  .r-none { border-radius: 0; }
  .r-xs { border-radius: 2px; }
  .r-sm { border-radius: 4px; }
  .r-md { border-radius: 6px; }
  .r-lg { border-radius: 8px; }
  .r-xl { border-radius: 12px; }
  .r-full { border-radius: 999px; }

  .tag { font-size: 11px; color: #999; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">

  <!-- 1. Hero 主按钮 -->
  <div>
    <div class="row-title">1. Hero 主按钮（填充 + 阴影）</div>
    <div class="group">
      <div><button class="btn r-none">rounded-none</button><div class="tag">0px</div></div>
      <div><button class="btn r-xs">rounded-xs</button><div class="tag">2px</div></div>
      <div><button class="btn r-sm">rounded-sm</button><div class="tag">4px</div></div>
      <div><button class="btn r-md" style="background:#c89b3c">rounded-md</button><div class="tag">6px ✅当前</div></div>
      <div><button class="btn r-lg">rounded-lg</button><div class="tag">8px</div></div>
      <div><button class="btn r-xl">rounded-xl</button><div class="tag">12px</div></div>
      <div><button class="btn r-full">rounded-full</button><div class="tag">999px</div></div>
    </div>
  </div>

  <!-- 2. 边框按钮 -->
  <div>
    <div class="row-title">2. 边框按钮（次要操作）</div>
    <div class="group">
      <div><button class="btn btn-outline r-none">rounded-none</button><div class="tag">0px</div></div>
      <div><button class="btn btn-outline r-xs">rounded-xs</button><div class="tag">2px</div></div>
      <div><button class="btn btn-outline r-sm">rounded-sm</button><div class="tag">4px</div></div>
      <div><button class="btn btn-outline r-md">rounded-md</button><div class="tag">6px ✅当前</div></div>
      <div><button class="btn btn-outline r-lg">rounded-lg</button><div class="tag">8px</div></div>
      <div><button class="btn btn-outline r-xl">rounded-xl</button><div class="tag">12px</div></div>
      <div><button class="btn btn-outline r-full">rounded-full</button><div class="tag">999px</div></div>
    </div>
  </div>

  <!-- 3. 模式切换按钮 -->
  <div>
    <div class="row-title">3. 模式切换按钮（Encode/Decode）</div>
    <div class="group">
      <div>
        <button class="btn btn-toggle btn-toggle-active r-none">Encode</button>
        <button class="btn btn-toggle r-none">Decode</button>
        <div class="tag">rounded-none 0px</div>
      </div>
      <div>
        <button class="btn btn-toggle btn-toggle-active r-xs">Encode</button>
        <button class="btn btn-toggle r-xs">Decode</button>
        <div class="tag">rounded-xs 2px</div>
      </div>
      <div>
        <button class="btn btn-toggle btn-toggle-active r-sm">Encode</button>
        <button class="btn btn-toggle r-sm">Decode</button>
        <div class="tag">rounded-sm 4px</div>
      </div>
      <div>
        <button class="btn btn-toggle btn-toggle-active r-md">Encode</button>
        <button class="btn btn-toggle r-md">Decode</button>
        <div class="tag">rounded-md 6px ✅当前</div>
      </div>
      <div>
        <button class="btn btn-toggle btn-toggle-active r-lg">Encode</button>
        <button class="btn btn-toggle r-lg">Decode</button>
        <div class="tag">rounded-lg 8px</div>
      </div>
      <div>
        <button class="btn btn-toggle btn-toggle-active r-xl">Encode</button>
        <button class="btn btn-toggle r-xl">Decode</button>
        <div class="tag">rounded-xl 12px</div>
      </div>
      <div>
        <button class="btn btn-toggle btn-toggle-active r-full">Encode</button>
        <button class="btn btn-toggle r-full">Decode</button>
        <div class="tag">rounded-full 999px</div>
      </div>
    </div>
  </div>

  <!-- 4. 小按钮（复制） -->
  <div>
    <div class="row-title">4. 小按钮（复制/下载）</div>
    <div class="group">
      <div><button class="btn btn-sm r-none" style="background:#c89b3c;color:white;min-width:72px">Copy</button><div class="tag">0px</div></div>
      <div><button class="btn btn-sm r-xs" style="background:#c89b3c;color:white;min-width:72px">Copy</button><div class="tag">2px</div></div>
      <div><button class="btn btn-sm r-sm" style="background:#c89b3c;color:white;min-width:72px">Copy</button><div class="tag">4px</div></div>
      <div><button class="btn btn-sm r-md" style="background:#c89b3c;color:white;min-width:72px">Copy</button><div class="tag">6px ✅当前</div></div>
      <div><button class="btn btn-sm r-lg" style="background:#c89b3c;color:white;min-width:72px">Copy</button><div class="tag">8px</div></div>
      <div><button class="btn btn-sm r-xl" style="background:#c89b3c;color:white;min-width:72px">Copy</button><div class="tag">12px</div></div>
      <div><button class="btn btn-sm r-full" style="background:#c89b3c;color:white;min-width:72px">Copy</button><div class="tag">999px</div></div>
    </div>
  </div>

</div>
</body>
</html>
