<!DOCTYPE html>
<html>
<head><title>AI 分类图标 - 调研参考</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #faf9f7; padding: 40px; }
  .container { max-width: 700px; margin: 0 auto; }
  .section { margin-bottom: 32px; }
  h2 { font-size: 14px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  h3 { font-size: 13px; color: #666; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px 8px; border-radius: 8px; border: 1px solid #eee;
    background: white; cursor: pointer; transition: all 0.2s;
  }
  .item:hover { border-color: #c89b3c; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .icon { font-size: 36px; line-height: 1; }
  .label { font-size: 11px; color: #666; text-align: center; }
  .source { font-size: 10px; color: #bbb; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <div class="section">
    <h2>同类网站实际使用的图标</h2>
    <div class="grid">
      <div class="item"><div class="icon">🤖</div><div class="label">机器人</div><div class="source">futurepedia / aitoolgo / toolify</div></div>
      <div class="item"><div class="icon">🧙</div><div class="label">魔法师</div><div class="source">Merlin AI</div></div>
      <div class="item"><div class="icon">✨</div><div class="label">星光</div><div class="source">多个 AI 工具站</div></div>
      <div class="item"><div class="icon">⚡</div><div class="label">闪电</div><div class="source">AI 速度/驱动</div></div>
    </div>
  </div>

  <div class="section">
    <h2>AI 主题相关推荐</h2>
    <div class="grid">
      <div class="item"><div class="icon">🪄</div><div class="label">魔法棒</div><div class="source">AI 魔法</div></div>
      <div class="item"><div class="icon">🧠</div><div class="label">大脑</div><div class="source">AI 智能</div></div>
      <div class="item"><div class="icon">🔮</div><div class="label">水晶球</div><div class="source">AI 预测</div></div>
      <div class="item"><div class="icon">💡</div><div class="label">灯泡</div><div class="source">AI 灵感</div></div>
    </div>
  </div>
</div>
</body>
</html>
